<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Access Cash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            background: #ffffff;

            /* Stop the wrapper page from scrolling */
            overflow: hidden;

            /* Keep the screen fixed */
            position: fixed;
            top: 0;
            left: 0;

            overscroll-behavior: none;
        }

        body {
            touch-action: none;
        }

        /* AppCreator24 page */
        iframe {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;
            margin: 0;
            padding: 0;

            overflow: hidden;
        }

        /*
         * WHITE BOTTOM COVER
         *
         * Covers:
         * - Share
         * - X Post
         * - Report app anonymously
         * - AppCreator24 footer
         *
         * It also blocks taps and swipes
         * in the covered area.
         */
        .bottom-cover {
            position: fixed;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 42vh;

            background: #ffffff;

            z-index: 999999999;

            /* Block clicks/taps */
            pointer-events: auto;

            /* Block scrolling/swiping */
            touch-action: none;

            /* No visual border */
            border: none;
        }
    </style>
</head>

<body>

    <iframe
        src="https://www.appcreator24.com/app3999740-hjqncg"
        title="Access Cash"
        scrolling="no">
    </iframe>

    <!--
        White area covering the unwanted
        bottom section and blocking interaction.
    -->
    <div class="bottom-cover"></div>

</body>
</html>
