<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Cash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /*
         * WHITE PROTECTIVE COVER
         *
         * Covers only the bottom section:
         * - Share
         * - X Post
         * - Report app anonymously
         * - AppCreator24 footer
         *
         * IMPORTANT:
         * pointer-events: auto prevents clicks/taps
         * from reaching anything underneath the white area.
         */
        .bottom-cover {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 42vh;
            background: #ffffff;
            z-index: 999999999;
            pointer-events: auto;
            cursor: default;
        }
    </style>
</head>

<body>

    <iframe
        src="https://www.appcreator24.com/app3999740-hjqncg"
        title="Access Cash">
    </iframe>

    <!--
        This white area blocks all touches/clicks
        underneath it.
    -->
    <div class="bottom-cover"></div>

</body>
</html>
